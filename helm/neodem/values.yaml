# values.yaml - NeoDEM Helm Chart Default Values
# =============================================================================
# This file contains default configuration for the NeoDEM Helm chart.
# Override these values in values-production.yaml or via --set flags.
# =============================================================================

# -----------------------------------------------------------------------------
# Global Settings
# -----------------------------------------------------------------------------
global:
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Storage class for persistent volumes (empty = default)
  storageClass: ""

# -----------------------------------------------------------------------------
# Production Settings
# -----------------------------------------------------------------------------
production:
  # Require secrets to be set (fails deployment if missing)
  requireSecrets: false
  # Enable RBAC resources
  rbac:
    enabled: true

# -----------------------------------------------------------------------------
# Secrets Configuration
# -----------------------------------------------------------------------------
secrets:
  # JWT secret for authentication (required in production)
  jwtSecret: "dev-secret-change-in-production"
  # Google API key for AI services
  googleApiKey: ""
  # Gemini API key for robot agent
  geminiApiKey: ""

# -----------------------------------------------------------------------------
# PostgreSQL Database
# -----------------------------------------------------------------------------
postgres:
  enabled: true
  external:
    # Use external PostgreSQL (RDS, Cloud SQL, etc.)
    enabled: false
    # Connection string for external PostgreSQL
    host: ""
    port: 5432
    database: "neodem"
    username: "neodem"
    # Password should be set via secrets
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent
  auth:
    database: neodem
    username: neodem
    password: "neodem-dev"
  storage:
    size: 10Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -----------------------------------------------------------------------------
# NATS JetStream (Message Queue)
# -----------------------------------------------------------------------------
nats:
  enabled: true
  external:
    # Use external NATS (Synadia NGS, etc.)
    enabled: false
    # NATS server URLs (comma-separated)
    servers: ""
  image:
    repository: nats
    tag: "2.10-alpine"
    pullPolicy: IfNotPresent
  storage:
    size: 10Gi
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "200m"

# -----------------------------------------------------------------------------
# RustFS Object Storage (S3-compatible)
# -----------------------------------------------------------------------------
rustfs:
  enabled: true
  external:
    # Use external S3 (AWS S3, GCS, etc.)
    enabled: false
    # S3 endpoint URL
    endpoint: ""
    # Region for AWS S3
    region: "us-east-1"
  image:
    repository: rustfs/rustfs
    # Pinned: `latest` changed under running installs. 1.0.0 is the newest
    # release at least two weeks old on 2026-10-12 (TASK-364).
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  storage:
    size: 50Gi
  auth:
    # Access key for S3 authentication
    accessKey: "rustfsadmin"
    # Secret key for S3 authentication
    secretKey: "rustfsadmin"
  # Buckets to create on initialization. Must cover every bucket in the
  # server's `BUCKETS` map (server/src/storage/model-storage.ts): the server
  # never creates buckets, so a missing one fails its feature at runtime.
  # Enforced by server/src/storage/__tests__/bucket-provisioning.test.ts.
  buckets:
    - training-datasets
    - model-checkpoints
    - production-models
    - robot-logs
    - sensor-scans
    - digital-twins
    - incident-clips
    - patrol-photos
  init:
    image:
      repository: amazon/aws-cli
      # Pinned like RustFS above (TASK-364).
      tag: "2.37.4"
      pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"
      cpu: "500m"

# -----------------------------------------------------------------------------
# Server (Node.js API)
# -----------------------------------------------------------------------------
server:
  enabled: true
  image:
    repository: ghcr.io/raasaar-org/neodem-server
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 3001
  env:
    nodeEnv: production
    authDisabled: "true"
    # Robot-wide per-user control leases (TASK-321): on by default; "false"
    # turns the lease routes off (GET answers enabled:false, POSTs 404).
    controlLeasesEnabled: "true"
    publicUrl: ""
    corsOrigins: ""
    # V8 sizes its default heap from the machine, not the container, and a
    # 512Mi pod ended up with ~240 MB of it. 384 MB leaves room for buffers and
    # native memory under the limit below; keep the two in step (TASK-355).
    nodeOptions: "--max-old-space-size=384"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  # Health check configuration
  healthCheck:
    enabled: true
    path: /health
    initialDelaySeconds: 30
    periodSeconds: 30
    timeoutSeconds: 10
  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# App (React Frontend)
# -----------------------------------------------------------------------------
app:
  enabled: true
  image:
    repository: ghcr.io/raasaar-org/neodem-app
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  # Ingress configuration for external access
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts:
      - host: neodem.local
        paths:
          - path: /
            pathType: Prefix
    tls: []
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"
  # Horizontal Pod Autoscaler
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

# -----------------------------------------------------------------------------
# Robot Agent (Simulated Robot)
# -----------------------------------------------------------------------------
robotAgent:
  enabled: true
  image:
    repository: ghcr.io/raasaar-org/neodem-robot-agent
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 41243
  env:
    robotId: "sim-robot-001"
    robotName: "SimBot-01"
    robotModel: "SimBot H1"
    robotClass: "standard"
    maxPayloadKg: "10"
    robotDescription: "A versatile humanoid robot for general tasks"
    initialX: "10.0"
    initialY: "10.0"
    initialFloor: "1"
    # Require a bound control lease for motion (TASK-321): opt-in, default
    # "false". "true" refuses motion from clients that never bind a lease
    # (sockets: lease_required; REST starts while another user holds it: 409
    # control_lease_held) — no grace mode. Turn on only once every client binds.
    controlLeaseRequired: "false"
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# -----------------------------------------------------------------------------
# VLA Inference Server (Vision-Language-Action)
# -----------------------------------------------------------------------------
vlaInference:
  enabled: false
  image:
    repository: ghcr.io/raasaar-org/neodem-vla-server
    tag: "latest"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    httpPort: 8000
  config:
    # Model type: pi0, openvla, etc.
    modelType: "pi0"
    # Device: cpu, cuda, or mps (Apple Silicon)
    device: "cpu"
  # GPU configuration (NVIDIA)
  gpu:
    enabled: false
    # Number of GPUs to request
    count: 1
    # Node selector for GPU nodes
    nodeSelector:
      nvidia.com/gpu.present: "true"
    # Tolerations for GPU nodes
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
  resources:
    requests:
      memory: "2Gi"
      cpu: "1000m"
    limits:
      memory: "4Gi"
      cpu: "2000m"

# -----------------------------------------------------------------------------
# Service Account and RBAC
# -----------------------------------------------------------------------------
serviceAccount:
  # Create a service account
  create: true
  # Name of the service account (auto-generated if empty)
  name: ""
  # Annotations for the service account
  annotations: {}

# -----------------------------------------------------------------------------
# Pod Security
# -----------------------------------------------------------------------------
podSecurityContext:
  fsGroup: 1000

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: false

# -----------------------------------------------------------------------------
# Combined Ingress (App + Server API)
# -----------------------------------------------------------------------------
# This creates a single ingress that routes /api to server and / to app
# For separate app-only ingress, use app.ingress instead
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: neodem.local
  tls: false
  tlsSecretName: ""

# -----------------------------------------------------------------------------
# Network Policy
# -----------------------------------------------------------------------------
networkPolicy:
  # Enable network policies for pod-to-pod communication restriction
  enabled: false

# -----------------------------------------------------------------------------
# Node Scheduling
# -----------------------------------------------------------------------------
nodeSelector: {}
tolerations: []
affinity: {}
