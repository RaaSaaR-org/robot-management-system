{{/*
robot-agent-service.yaml - NeoDEM Robot Agent Service
=============================================================================
*/}}
{{- if .Values.robotAgent.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neodem.robotAgent.fullname" . }}
  labels:
    {{- include "neodem.labels" . | nindent 4 }}
    app.kubernetes.io/component: robot-agent
spec:
  type: {{ .Values.robotAgent.service.type }}
  ports:
    - port: {{ .Values.robotAgent.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "neodem.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: robot-agent
{{- end }}
