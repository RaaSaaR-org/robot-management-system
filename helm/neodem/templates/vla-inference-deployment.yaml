{{/*
vla-inference-deployment.yaml - VLA Inference Server Deployment
=============================================================================
Vision-Language-Action model inference service (CPU-only configuration)
*/}}
{{- if .Values.vlaInference.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neodem.vlaInference.fullname" . }}
  labels:
    {{- include "neodem.labels" . | nindent 4 }}
    app.kubernetes.io/component: vla-inference
spec:
  replicas: {{ .Values.vlaInference.replicaCount }}
  selector:
    matchLabels:
      {{- include "neodem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: vla-inference
  template:
    metadata:
      labels:
        {{- include "neodem.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: vla-inference
    spec:
      {{- include "neodem.imagePullSecrets" . | nindent 6 }}
      serviceAccountName: {{ include "neodem.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: vla-inference
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.vlaInference.image.repository }}:{{ .Values.vlaInference.image.tag }}"
          imagePullPolicy: {{ .Values.vlaInference.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.vlaInference.service.httpPort }}
              protocol: TCP
          env:
            - name: VLA_PORT
              value: {{ .Values.vlaInference.service.httpPort | quote }}
            - name: VLA_DEVICE
              value: {{ .Values.vlaInference.config.device | quote }}
            - name: VLA_MODEL_TYPE
              value: {{ .Values.vlaInference.config.modelType | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            {{- if .Values.vlaInference.gpu.enabled }}
            requests:
              {{- with .Values.vlaInference.resources.requests }}
              memory: {{ .memory | quote }}
              cpu: {{ .cpu | quote }}
              {{- end }}
              nvidia.com/gpu: {{ .Values.vlaInference.gpu.count | quote }}
            limits:
              {{- with .Values.vlaInference.resources.limits }}
              memory: {{ .memory | quote }}
              cpu: {{ .cpu | quote }}
              {{- end }}
              nvidia.com/gpu: {{ .Values.vlaInference.gpu.count | quote }}
            {{- else }}
            {{- toYaml .Values.vlaInference.resources | nindent 12 }}
            {{- end }}
          {{- if .Values.securityContext.readOnlyRootFilesystem }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /.cache
          {{- end }}
      {{- if .Values.securityContext.readOnlyRootFilesystem }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: cache
          emptyDir: {}
      {{- end }}
      {{- if .Values.vlaInference.gpu.enabled }}
      nodeSelector:
        {{- toYaml .Values.vlaInference.gpu.nodeSelector | nindent 8 }}
      tolerations:
        {{- toYaml .Values.vlaInference.gpu.tolerations | nindent 8 }}
      {{- else }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
