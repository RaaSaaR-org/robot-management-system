{{/*
pdb.yaml - PodDisruptionBudgets for NeoDEM
=============================================================================
Ensures controlled pod eviction during cluster maintenance and upgrades.
*/}}

{{/* Server PDB */}}
{{- if and .Values.server.enabled (gt (int .Values.server.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "neodem.server.fullname" . }}
  labels:
    {{- include "neodem.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "neodem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
---
{{- end }}

{{/* App PDB */}}
{{- if and .Values.app.enabled (gt (int .Values.app.replicaCount) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "neodem.app.fullname" . }}
  labels:
    {{- include "neodem.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "neodem.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
---
{{- end }}

