{{/*
vla-inference-service.yaml - VLA Inference Service
=============================================================================
*/}}
{{- if .Values.vlaInference.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "neodem.vlaInference.fullname" . }}
  labels:
    {{- include "neodem.labels" . | nindent 4 }}
    app.kubernetes.io/component: vla-inference
spec:
  type: {{ .Values.vlaInference.service.type }}
  ports:
    - port: {{ .Values.vlaInference.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "neodem.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: vla-inference
{{- end }}
