name: SCRAI Daily Standup

on:
  schedule:
    - cron: '0 9 * * 1-6'  # Mon-Sat 9:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  daily-standup:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENCODE_DISABLE_AUTOUPDATE: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 50

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCode and MissionControl
        run: |
          npm install -g opencode-ai@latest
          cargo install mc

      - name: Run Daily Standup
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p docs/planning/standups
          opencode run --agent scrai-standup "Generate the daily standup report for ${DATE}."

      - name: Commit and push
        run: |
          git config user.name "SCRAI Bot"
          git config user.email "scrai-bot@users.noreply.github.com"
          git add docs/planning/standups/ .mc/
          git diff --staged --quiet || git commit -m "scrai: daily standup - $(date +%Y-%m-%d)"
          git push
