name: Check

# Pre-merge gate for the things actually shipped from this repo:
#   - server typecheck + build
#   - app   typecheck + build (default mode)
#   - app   build with VITE_DEMO_MODE=true (mirrors deploy-demo.yml)
#
# No service containers (no postgres, nats, rustfs) — the previous
# smoke-test.yml stood up a full stack to exercise one dataset CRUD
# call against a server image that hasn't been published since
# v0.0.2 (Jan 2026). The only thing this repo actually deploys via CI
# is the demo-mode app to GitHub Pages, so we gate on what would
# break that build, plus general type safety for the local dev loop.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Build
        working-directory: server
        run: npm run build

  app:
    name: App typecheck + build (dev + demo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Match deploy-demo.yml's Node version so the demo build runs on
      # the same toolchain that ships to GitHub Pages.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Build (dev mode)
        working-directory: app
        run: npm run build

      # The only deployment from this repo (deploy-demo.yml) ships the
      # app with VITE_DEMO_MODE=true. If a PR breaks the demo build,
      # the next push to main will silently 500 the GitHub Pages site
      # — gate on it here instead.
      - name: Build (demo mode, mirrors deploy-demo.yml)
        working-directory: app
        env:
          VITE_DEMO_MODE: 'true'
        run: npm run build
