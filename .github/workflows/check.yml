name: Check

# Pre-merge gate for the things actually shipped from this repo:
#   - server      typecheck + unit tests + build
#   - app         typecheck + unit tests + build (default mode)
#   - app         build with VITE_DEMO_MODE=true (mirrors deploy-demo.yml)
#   - robot-agent typecheck + unit tests
#
# Unit tests (vitest) run with no external services — they mock Prisma,
# NATS, sockets, and subprocesses, so no postgres/nats/rustfs containers
# are needed. The previous smoke-test.yml stood up a full stack to
# exercise one dataset CRUD call against a server image that hasn't been
# published since v0.0.2 (Jan 2026); we gate on the vitest suites plus
# type safety instead.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs when a new commit lands on the same branch.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The committed Prisma schema targets SQLite (provider = "sqlite"); the
    # vitest suites run against a throwaway file DB created below — no external
    # Postgres needed.
    env:
      DATABASE_URL: file:./ci-test.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Typecheck
        working-directory: server
        run: npm run typecheck

      - name: Set up test database (SQLite)
        working-directory: server
        run: npx prisma db push --skip-generate --accept-data-loss

      - name: Test
        working-directory: server
        run: npm test

      - name: Build
        working-directory: server
        run: npm run build

  app:
    name: App typecheck + build (dev + demo)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Match deploy-demo.yml's Node version so the demo build runs on
      # the same toolchain that ships to GitHub Pages.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit

      - name: Test
        working-directory: app
        run: npm test

      - name: Build (dev mode)
        working-directory: app
        run: npm run build

      # The only deployment from this repo (deploy-demo.yml) ships the
      # app with VITE_DEMO_MODE=true. If a PR breaks the demo build,
      # the next push to main will silently 500 the GitHub Pages site
      # — gate on it here instead.
      - name: Build (demo mode, mirrors deploy-demo.yml)
        working-directory: app
        env:
          VITE_DEMO_MODE: 'true'
        run: npm run build

  robot-agent:
    name: Robot agent typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: robot-agent/package-lock.json

      - name: Install
        working-directory: robot-agent
        run: npm ci

      - name: Typecheck
        working-directory: robot-agent
        run: npm run typecheck

      - name: Test
        working-directory: robot-agent
        run: npm test

  migrations:
    name: Prisma migrations match schema (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Production deploys run `prisma migrate deploy` against Postgres, then
    # generate the client from schema.prisma. If a model was only ever applied
    # via `db push`, a fresh migrate deploy produces a schema that DOESN'T match
    # the client → runtime P2022 "column does not exist" (issue #174). This job
    # replays the committed migrations onto a clean Postgres and fails if the
    # result drifts from schema.prisma, forcing a catch-up migration.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: shadow
          POSTGRES_DB: neodem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:shadow@localhost:5432/neodem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      # Mirror the production build: the committed schema targets SQLite for
      # local dev; deploys sed it to postgresql (see server/Dockerfile).
      - name: Switch Prisma provider to PostgreSQL
        working-directory: server
        run: sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma

      - name: Apply migrations to a clean Postgres
        working-directory: server
        run: npx prisma migrate deploy

      # --exit-code returns 2 when the live (migration-only) DB differs from
      # schema.prisma — i.e. drift that a fresh deploy would carry into the
      # generated client. Add a catch-up migration to resolve it.
      - name: Assert migrations == schema (no drift)
        working-directory: server
        run: |
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code || {
              echo "::error::prisma/migrations drifts from schema.prisma. A model was likely applied via 'db push' without a migration. Generate a catch-up migration (see prisma/migrations/20260701120000_catch_up_db_push_column_drift)."
              exit 1
            }
