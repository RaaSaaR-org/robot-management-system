name: SCRAI Sunday Sprint Cycle

on:
  schedule:
    - cron: '0 9 * * 0'  # Sunday 9:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  sprint-cycle:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENCODE_DISABLE_AUTOUPDATE: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for sprint analysis

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install OpenCode and MissionControl
        run: |
          npm install -g opencode-ai@latest
          cargo install mc

      - name: Retrospective
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p docs/planning/retrospectives
          opencode run --agent scrai-retro "Run the sprint retrospective for ${DATE}. Close the active sprint and generate the retro report."

      - name: Backlog Grooming
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p docs/planning/grooming
          opencode run --agent scrai-grooming "Analyze the backlog and generate the grooming report for ${DATE}."

      - name: Sprint Planning
        run: |
          DATE=$(date +%Y-%m-%d)
          mkdir -p docs/planning/sprints
          opencode run --agent scrai-sprint-planning "Create the next sprint starting ${DATE}. Use the grooming report to select tasks."

      - name: Commit and push
        run: |
          git config user.name "SCRAI Bot"
          git config user.email "scrai-bot@users.noreply.github.com"
          git add .mc/ docs/planning/
          git diff --staged --quiet || git commit -m "scrai: sunday sprint cycle - $(date +%Y-%m-%d)"
          git push
