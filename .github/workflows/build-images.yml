name: Build Container Images

on:
  push:
    tags: ['v*']
  # Allow the release workflow to build images in the same run (a tag pushed by
  # GITHUB_TOKEN cannot trigger `on: push: tags`), and allow manual rebuilds.
  workflow_call:
    inputs:
      version:
        description: 'Image version tag (e.g. 2026.06.21)'
        type: string
        required: false
        default: ''
      # Both set by main-images.yml, which publishes every checked commit on
      # main (TASK-312). Left blank, the build is exactly what it always was.
      ref:
        description: 'Full commit SHA to build and to record as org.opencontainers.image.revision. Blank = github.sha.'
        type: string
        required: false
        default: ''
      commit_tag:
        description: 'Immutable per-commit tag (e.g. sha-77cc8ff). When set it is the ONLY tag published, and an existing tag is never overwritten.'
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Image version tag to publish (e.g. 2026.06.21). Blank = latest only.'
        type: string
        required: false
        default: ''

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

# Each architecture is built on a runner of that architecture, and the two are
# stitched into one multi-arch manifest afterwards.
#
# This used to be a single buildx call per component with
# `platforms: linux/arm64,linux/amd64`, which meant the arm64 half ran under
# QEMU. That did not work and failed in the worst possible way: on the
# v2026.08.21 release the robot-agent build logged
#
#     #14 29.13 qemu: uncaught target signal 4 (Illegal instruction) - core dumped
#
# inside the arm64 `npm ci`, and then hung — a QEMU crash does not fail the
# build, it wedges it — until GitHub killed the job at its 6-hour ceiling
# (14:58:27 -> 20:58:42). It went unnoticed because the amd64 half of the
# v2026.08.27 build failed first, on a separate lockfile problem, and cancelled
# the arm64 half at 44 s before it could crash again.
#
# `ubuntu-24.04-arm` runs arm64 natively, so there is no emulation left to
# crash, and it is free on public repositories. `timeout-minutes` stays anyway:
# it is what turns any future wedge into a bounded, diagnosable failure instead
# of a burnt runner.
jobs:
  build:
    name: Build ${{ matrix.component }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      # One arch failing must not hide the other's result — that is exactly how
      # the arm64 crash stayed invisible for a release.
      fail-fast: false
      matrix:
        component: [app, server, robot-agent]
        platform: [linux/amd64, linux/arm64]
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          # Applies to both app rows; absent (and so empty) for the others.
          - component: app
            build_args: |
              VITE_API_BASE_URL=/api
              VITE_WS_URL=/api/a2a/ws
              VITE_A2A_SERVER_URL=
    steps:
      # `inputs.ref` matters for main-images.yml: it is called from a
      # `workflow_run` event, whose `github.sha` is the tip of main at the time
      # the run started — not the commit whose Check passed.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      # `linux/amd64` is not a legal artifact name; `linux-amd64` is.
      - name: Normalise platform for artifact names
        run: echo "PLATFORM_PAIR=${{ matrix.platform }}" | tr '/' '-' >> $GITHUB_ENV

      # GHCR refuses a repository name with an uppercase letter, and this
      # organisation has three of them. `docker/metadata-action` lowercases the
      # name it is given, which is why `images:` below can interpolate the owner
      # raw and still work — but every hand-written reference to the repository
      # has to do it itself. They all read this one value instead.
      - name: Compute the image repository (GHCR requires it lowercase)
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${{ env.REGISTRY }}/$owner/neodem-${{ matrix.component }}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only. Tags are applied once, by the merge job, to the manifest
      # list — a per-arch image must not carry them or the two arches would
      # race to own the same tag.
      #
      # The revision label is overridden rather than left to the action, which
      # would write `github.sha` — wrong under `workflow_run` (see checkout).
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.revision=${{ inputs.ref || github.sha }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Scoped per component AND per arch: a shared scope would have the two
          # architectures evicting each other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.component }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Publish ${{ matrix.component }} manifest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No `if:` here on purpose, and this is a deliberate behaviour CHANGE.
    #
    # `needs: build` waits on the whole matrix, so one failing arch of one
    # component skips every manifest — nothing publishes. Previously each
    # component was its own job, so a component could publish while another
    # failed. That is exactly what happened on v2026.08.27: app and server
    # published, robot-agent did not, and GHCR `latest` has been skewed since
    # (server/app 2026.08.27, robot-agent 2026.08.09) while all three Helm
    # values default to `tag: "latest"` — so a chart install runs an 08-27
    # server against an 08-09 agent.
    #
    # A release that publishes nothing is recoverable with one re-run. A
    # release that publishes two thirds of itself is a skew nobody notices
    # until something misbehaves in a cluster.
    needs: build
    strategy:
      fail-fast: false
      matrix:
        component: [app, server, robot-agent]
    steps:
      # Same reason as in `build`: everything below that names the repository
      # by hand needs it lowercased.
      - name: Compute the image repository (GHCR requires it lowercase)
        run: |
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=${{ env.REGISTRY }}/$owner/neodem-${{ matrix.component }}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.component }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # A commit build (commit_tag set) publishes that one tag and nothing
          # else: moving `latest` on every merge would silently change what a
          # Helm install with the default `tag: "latest"` runs. Release/tag
          # builds are exactly as before.
          tags: |
            type=raw,value=${{ inputs.commit_tag }},enable=${{ inputs.commit_tag != '' }}
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' && inputs.commit_tag == '' }}
            type=ref,event=tag,enable=${{ inputs.commit_tag == '' }}
            type=match,pattern=v(.*),group=1,enable=${{ inputs.commit_tag == '' }}
            type=raw,value=latest,enable=${{ inputs.commit_tag == '' }}

      # A commit tag is immutable: once `sha-<short>` exists it names what a
      # deployment may already run, so a re-run must never repoint it. This is
      # also what lets a re-run after a partial failure fill in just the
      # missing components.
      - name: Refuse to overwrite an existing commit tag
        id: exists
        if: inputs.commit_tag != ''
        run: |
          if docker buildx imagetools inspect "${{ env.IMAGE }}:${{ inputs.commit_tag }}" >/dev/null 2>&1; then
            echo "${{ env.IMAGE }}:${{ inputs.commit_tag }} already exists — leaving it untouched."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create manifest list and push
        if: steps.exists.outputs.skip != 'true'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: |
          docker buildx imagetools inspect \
            ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # build-vla-server: removed — VLA Server is now in its own repository
