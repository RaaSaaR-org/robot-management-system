# ============================================================================
# NeoDEM Docker Compose
# Development and testing environment
# ============================================================================
#
# Usage:
#   docker-compose up -d              # Start all services
#   docker-compose up -d --build      # Build and start
#   docker-compose logs -f            # View logs
#   docker-compose down -v            # Stop and remove volumes
#
# Environment Variables:
#   Create a .env file in the root directory with:
#   - JWT_SECRET=your-secure-secret
#   - GOOGLE_API_KEY=your-google-api-key
#   - GEMINI_API_KEY=your-gemini-api-key
#
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # NATS JetStream (Message Queue)
  # --------------------------------------------------------------------------
  nats:
    image: nats:2.10-alpine
    container_name: neodem-nats
    command: ["--js", "--sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"   # Client connections
      - "8222:8222"   # HTTP monitoring
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neodem-network

  # --------------------------------------------------------------------------
  # RustFS Object Storage (S3-compatible)
  # Single-node for development. Container runs as UID 10001 (rustfs user).
  # --------------------------------------------------------------------------
  rustfs:
    image: rustfs/rustfs:latest
    container_name: neodem-rustfs
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9001/rustfs/console/index.html"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neodem-network

  # Bucket initialization container (uses AWS CLI for S3-compatible operations)
  rustfs-init:
    image: amazon/aws-cli:latest
    container_name: neodem-rustfs-init
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: /bin/sh
    command: >
      -c "
      aws --endpoint-url http://rustfs:9000 s3 mb s3://training-datasets || true &&
      aws --endpoint-url http://rustfs:9000 s3 mb s3://model-checkpoints || true &&
      aws --endpoint-url http://rustfs:9000 s3 mb s3://production-models || true &&
      aws --endpoint-url http://rustfs:9000 s3 mb s3://robot-logs || true &&
      echo 'RustFS buckets initialized successfully'
      "
    networks:
      - neodem-network

  # --------------------------------------------------------------------------
  # PostgreSQL Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: neodem-postgres
    environment:
      POSTGRES_DB: neodem
      POSTGRES_USER: neodem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neodem-dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres-init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neodem -d neodem"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neodem-network

  # --------------------------------------------------------------------------
  # Server (Node.js API)
  # --------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: neodem-server
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://neodem:${POSTGRES_PASSWORD:-neodem-dev}@postgres:5432/neodem
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production}
      JWT_ACCESS_EXPIRES: ${JWT_ACCESS_EXPIRES:-15m}
      JWT_REFRESH_EXPIRES: ${JWT_REFRESH_EXPIRES:-7d}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:80,http://app,http://app:80}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      WORKER_API_TOKEN: ${WORKER_API_TOKEN:-}
      NATS_SERVERS: nats://nats:4222
      NATS_USER: ${NATS_USER:-}
      NATS_PASS: ${NATS_PASS:-}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      GPU_TOTAL_COUNT: ${GPU_TOTAL_COUNT:-1}
      GPU_TYPE: ${GPU_TYPE:-unknown}
      GPU_MEMORY_GB: ${GPU_MEMORY_GB:-0}
      COMPLIANCE_LOG_ENCRYPTION_KEY: ${COMPLIANCE_LOG_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    ports:
      - "3001:3001"
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - neodem-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # App (React Frontend via nginx)
  # --------------------------------------------------------------------------
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_A2A_SERVER_URL: ${VITE_A2A_SERVER_URL:-}
    container_name: neodem-app
    ports:
      - "80:80"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - neodem-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Robot Agent (Simulated Robot)
  # Optional: Comment out if not needed for testing
  # --------------------------------------------------------------------------
  robot-agent:
    build:
      context: ./robot-agent
      dockerfile: Dockerfile
    container_name: neodem-robot-agent
    environment:
      NODE_ENV: production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SERVER_URL: http://server:3001
      PUBLIC_URL: ${ROBOT_PUBLIC_URL:-http://localhost:41243}
      PORT: 41243
      ROBOT_ID: ${ROBOT_ID:-sim-robot-001}
      ROBOT_NAME: ${ROBOT_NAME:-SimBot-01}
      ROBOT_MODEL: ${ROBOT_MODEL:-SimBot H1}
      ROBOT_CLASS: ${ROBOT_CLASS:-standard}
      MAX_PAYLOAD_KG: ${MAX_PAYLOAD_KG:-10}
      ROBOT_DESCRIPTION: ${ROBOT_DESCRIPTION:-A versatile humanoid robot for general tasks}
      INITIAL_X: ${INITIAL_X:-10.0}
      INITIAL_Y: ${INITIAL_Y:-10.0}
      INITIAL_ZONE: ${INITIAL_ZONE:-Warehouse A}
      INITIAL_FLOOR: ${INITIAL_FLOOR:-1}
    ports:
      - "41243:41243"
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:41243/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - neodem-network
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # VLA Server (FastAPI HTTP)
  # Vision-Language-Action model inference (SmolVLA, Pi0.5, GR00T)
  # Optional: only needed for local dev with VLA; runs on Mac for production
  # --------------------------------------------------------------------------
  vla-server:
    build:
      context: ./vla-server
    container_name: neodem-vla-server
    environment:
      VLA_DEVICE: ${VLA_DEVICE:-cpu}
      VLA_MODEL: ${VLA_MODEL:-smolvla}
      VLA_STUB: ${VLA_STUB:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - neodem-network
    restart: unless-stopped

# ============================================================================
# Volumes
# ============================================================================
volumes:
  nats_data:
    driver: local
  rustfs_data:
    driver: local
  rustfs_logs:
    driver: local
  postgres_data:
    driver: local

# ============================================================================
# Networks
# ============================================================================
networks:
  neodem-network:
    driver: bridge
