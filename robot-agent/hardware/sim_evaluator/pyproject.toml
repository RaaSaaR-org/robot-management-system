[project]
name = "sim-evaluator"
version = "0.1.0"
description = "MuJoCo closed-loop VLA evaluation for SO-101"
requires-python = ">=3.11"
dependencies = [
    "mujoco>=3.0.0",
    "gymnasium>=0.29.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "httpx>=0.25.0",
    # Real-to-sim room mesh pipeline (TASK-173): GLB->OBJ + CoACD convex
    # decomposition. Import-guarded in glb_to_obj.py — the evaluator still boots
    # and degrades to occupancy/AABB walls if these are absent.
    "trimesh>=4.0.0",
    "coacd>=1.0.0",
    "scipy>=1.10.0",
    # Sim-RL deployment gate (TASK-172.C Phase 3): run a trained policy.onnx
    # locally with no VLA server and no torch/SB3 — onnxruntime is enough to
    # score a navigation policy for the sim-to-real validation gate.
    "onnxruntime>=1.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
evaluate-vla = "evaluate_vla:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: heavy tests needing coacd + mujoco (CoACD decomposition / physics)",
]
