[project]
name = "smolvla-client"
version = "0.1.0"
description = "SmolVLA remote inference client for Raspberry Pi + SO-101"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

# NOTE: LeRobot with feetech support must be installed separately:
#   git clone https://github.com/huggingface/lerobot.git
#   cd lerobot && uv pip install -e ".[feetech]"
# Then install this client package into the same venv.
# Do NOT install smolvla extras on the Pi — the model runs on the Mac.

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
